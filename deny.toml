[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
	"MIT",
	"Apache-2.0",
	"MPL-2.0",
	"GPL-3.0",
	"Unicode-3.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
